<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pošlji prošnjo za sodelovanje pri testiranju aplikacije OpenSola Foundation.">
  <title>OpenSola Foundation | Prošnja za testiranje</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="brand-row">
        <div class="brand">
          <img src="assets/brand.svg" alt="OpenSola Foundation logotip" class="brand-mark">
          <span class="badge">OpenSola Foundation</span>
        </div>
        <nav class="top-nav" aria-label="Glavna navigacija">
          <div class="nav-links">
            <a class="text-link" href="index.html">Nazaj na domačo stran</a>
            <a class="text-link" href="#" title="Placeholder povezava do izvorne kode">Ogled izvorne kode</a>
          </div>
          <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Preklopi med svetlo in temno temo" aria-pressed="false">
            <span class="theme-toggle__icon" aria-hidden="true">🌙</span>
            <span class="theme-toggle__label">Temni način</span>
          </button>
        </nav>
      </div>

      <div class="hero-grid">
        <div>
          <h1>Prošnja za testiranje</h1>
          <p>Če želiš postati tester, izpolni spodnji obrazec. Vsebina bo posredovana za nadaljnji pregled.</p>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="section-card">
      <form id="application-form" class="application-form">
        <label>
          Ime
          <input type="text" name="firstName" placeholder="Vnesi ime" required>
        </label>

        <label>
          Priimek
          <input type="text" name="lastName" placeholder="Vnesi priimek" required>
        </label>

        <label>
          Zakaj bi rad testiral/a?
          <textarea name="reason" rows="6" placeholder="Na kratko opiši, zakaj želiš sodelovati pri testiranju." required></textarea>
        </label>

        <button class="primary-btn" type="submit">Pošlji prošnjo</button>
      </form>

      <p id="form-message" class="form-message" aria-live="polite"></p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 OpenSola Foundation</p>
    </div>
  </footer>

  <div class="theme-overlay" id="theme-overlay" aria-hidden="true"></div>

  <script src="script.js"></script>
</body>
</html>
