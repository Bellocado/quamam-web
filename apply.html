<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pošlji prošnjo za sodelovanje pri testiranju aplikacije Quamam.">
  <title>Ekipa OpenŠola | Prošnja za testiranje</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="brand-row">
        <div class="brand">
          <img src="assets/brand.svg" alt="Quamam logotip" class="brand-mark">
          <span class="badge">Ekipa OpenŠola</span>
        </div>
        <nav class="top-nav" aria-label="Glavna navigacija">
          <div class="nav-links">
            <a class="text-link" href="index.html">Nazaj na domačo stran</a>
            <a class="text-link" href="https://codeberg.org/OpenSola/Quamam" title="Povezava do izvorne kode">Ogled izvorne kode</a>
          </div>
          <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Preklopi med svetlo in temno temo" aria-pressed="false">
            <span class="theme-toggle__icon" aria-hidden="true">🌙</span>
            <span class="theme-toggle__label">Temni način</span>
          </button>
        </nav>
      </div>

      <div class="hero-grid">
        <div>
          <h1>Prošnja za testiranje</h1>
          <p>Postani del testne ekipe za aplikacijo Quamam. Izpolni spodnji obrazec in posredovali ti bomo navodila za dostop do aplikacije</p>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="section-card">
      <form id="application-form" class="application-form">
        <label for="field-firstName">
          Ime
          <input type="text" id="field-firstName" name="firstName" placeholder="Vnesi ime" required minlength="2">
        </label>

        <label for="field-lastName">
          Priimek
          <input type="text" id="field-lastName" name="lastName" placeholder="Vnesi priimek" required minlength="2">
        </label>

        <label for="field-reason">
          Zakaj bi rad/a testiral/a?
          <textarea id="field-reason" name="reason" rows="6" placeholder="Na kratko opiši, zakaj želiš sodelovati pri testiranju in katero napravo uporabljaš." required minlength="10"></textarea>
        </label>

        <button class="primary-btn" type="submit">Pošlji prošnjo</button>
      </form>

      <p id="form-message" class="form-message" aria-live="polite"></p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <br>
      <br>
      <br>
      <a href="pogoji.html">Pogoji uporabe</a>
      <p>&copy; 2026 Ekipa OpenŠola.</p>
    </div>
  </footer>

  <div class="theme-overlay" id="theme-overlay" aria-hidden="true"></div>

  <script src="script.js"></script>
</body>
</html>
